name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装 markdownlint
        run: npm install -g markdownlint-cli
      - name: 检查所有 md 文档
        run: markdownlint '**/*.md' --ignore node_modules

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验脚本语法
        run: python -m py_compile scripts/scaffold.py
